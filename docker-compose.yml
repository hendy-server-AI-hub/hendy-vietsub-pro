version: '3.8'

services:
  backend:
    build: ./backend
    container_name: autosub-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-""}
    volumes:
      - ./backend/temp:/app/temp
    restart: always

  frontend:
    build: ./frontend
    container_name: autosub-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
